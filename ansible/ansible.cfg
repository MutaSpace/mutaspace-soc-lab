# ansible.cfg
#
# Control-node settings for the MutaSpace SOC Lab.
#
# This file exists so that every operator runs the playbooks the same way. Ansible reads the
# ansible.cfg in the current working directory, which means every command in this area's
# documentation assumes you are standing in `ansible/` when you run it.
#
# Everything here is a lab decision, and each one is explained rather than copied.

[defaults]

# The inventory is static and committed. Every address in this lab is deterministic - either a
# static IP set by cloud-init or a DHCP reservation pinned to a MAC - so there is nothing for a
# dynamic inventory plugin to discover that we do not already know.
inventory = inventory/hosts.yml

# Roles live beside this file. `wazuh-ansible` is git-cloned into roles/ rather than installed
# from Galaxy - see requirements.yml and roles/README.md for why.
roles_path = roles

# Collections install into the project rather than the user's home directory, so two projects on
# the same workstation cannot fight over collection versions.
collections_path = collections

# The YAML callback prints multi-line output (PowerShell errors, ossec.conf diffs, installer logs)
# as readable blocks instead of one escaped line. It is FQCN-qualified because the `yaml` callback
# lives in community.general, not in ansible-core - a bare `yaml` here fails on modern Ansible.
stdout_callback = community.general.yaml

# Task timings. Useful teaching material: it makes visible that the Wazuh installer and the AD
# promotion reboot dominate the run, and that everything else is fast.
callbacks_enabled = ansible.posix.profile_tasks

# Retry files are noise in a repository. A failed run is re-run from the playbook, not from a
# scratch file that goes stale the moment the inventory changes.
retry_files_enabled = False

# Host key checking stays ON. Turning it off is the common lab shortcut and it teaches learners to
# ignore exactly the warning that would tell them they are talking to the wrong machine. The
# rebuild problem it creates is solved in [ssh_connection] below by keeping known_hosts inside the
# project, so a full lab rebuild is `rm .ssh/known_hosts` rather than a habit of trusting nothing.
host_key_checking = True

# Do not print "skipped" lines for the many host-specific tasks that no-op on most hosts.
display_skipped_hosts = False

# Silence the interpreter-discovery warning on Ubuntu 24.04.
interpreter_python = auto_silent

# Ten hosts, ten forks. The lab is small enough that this is the whole estate at once.
forks = 10

# Facts are cheap here and several plays branch on os_family.
gathering = smart

[inventory]

# A typo in a group name should be an error, not a silently empty play.
unparsed_is_failed = True

[ssh_connection]

# Project-local known_hosts. A rebuilt VM presents a new host key; scoping the trust store to this
# project means clearing it after a rebuild does not touch the operator's personal known_hosts.
ssh_args = -o UserKnownHostsFile=.ssh/known_hosts -o ControlMaster=auto -o ControlPersist=60s

# Pipelining removes one SSH round trip per task. It requires `requiretty` to be off in sudoers,
# which is the default on Ubuntu.
pipelining = True
