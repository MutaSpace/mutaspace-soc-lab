# playbooks/75-scenario-run.yml
#
# The incident-scenario runner. It sits in the free 75 slot between 70-detections and 90-lab-seed,
# and it is driven entirely by the catalogue in ansible/scenarios.yml plus one variable:
#
#   ansible-playbook playbooks/75-scenario-run.yml --tags verify -e scenario_id=ssh-bruteforce
#
# The playbook is tag-driven, so an operator runs one concern at a time:
#
#   --tags verify       the detection contract - did the expected alert reach the indexer
#   --tags setup        prepare the ground: attack tooling on kali-01, and a manager-health gate
#   --tags healthcheck  just the manager-health gate (a subset of setup)
#   --tags tooling      just the kali-01 attack tooling (a subset of setup)
#
# Later waves add the attack plays (they drive hydra/sqlmap against the target); the run path sets a
# `scenario_run_started_at` fact and then chains into the verify play, so the contract that proves a
# scenario worked lives in exactly one place.
#
# ---------------------------------------------------------------------------------------------
# WHY VERIFY RUNS ON wazuh-01 AND QUERIES THE INDEXER, NOT THE API
# ---------------------------------------------------------------------------------------------
# 70-detections talks to the 55000 API to MANAGE rules. Verify asks a different question - "did the
# alert actually land?" - and only the indexer (OpenSearch on 9200) can answer it, because that is
# where alerts are stored. Running on the manager itself keeps the query on 127.0.0.1: the control
# node needs no route to the SOC LAN and no copy of the manager's self-signed CA, exactly as
# 70-detections argues. validate_certs is false for that same scoped, loopback-only reason.
#
# THE VERIFY CONTRACT
# ---------------------------------------------------------------------------------------------
# For the selected scenario, each `expected_alerts` entry is turned into a bool query on
# wazuh-alerts-*: rule.id must match, every field in `match` must match, and @timestamp must be
# within the scenario's window. The query is polled (until/retries/delay derived from
# latency_budget_seconds) until the indexer holds at least `min_count` hits, then asserted with a
# diagnostic naming the rule, fields, window and observed count. A standalone verify (no preceding
# attack play) defaults the window to the last 15 minutes so a manually-tripped alert can be proven.
---
- name: Verify a scenario's expected alerts reached the Wazuh indexer
  hosts: wazuh_manager
  gather_facts: false
  become: true
  tags: [verify]

  vars:
    wazuh_indexer_base: "https://127.0.0.1:{{ wazuh_indexer_port }}"
    # A standalone verify has no attack timestamp to anchor to, so it looks back over a fixed
    # window. When the run path calls verify it passes a concrete scenario_run_started_at instead,
    # which narrows the query to the alerts that attack produced.
    scenario_window_start: "{{ scenario_run_started_at | default('now-15m') }}"
    # Poll cadence. retries per alert is derived from its latency_budget_seconds below.
    scenario_poll_delay: 10

  tasks:

    - name: Require a scenario id
      ansible.builtin.assert:
        that:
          - scenario_id is defined
          - scenario_id | length > 0
        fail_msg: >-
          scenario_id is not set. Pass it, e.g.
          `-e scenario_id=ssh-bruteforce`. See ansible/scenarios.yml for the catalogue.
        success_msg: "Verifying scenario '{{ scenario_id }}'"
      run_once: true

    - name: Load the scenario catalogue
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../scenarios.yml"
        name: _catalogue
      run_once: true

    - name: Select the requested scenario
      ansible.builtin.set_fact:
        scenario: "{{ _catalogue.scenarios | selectattr('id', 'equalto', scenario_id) | first }}"
      run_once: true

    - name: Confirm the scenario exists in the catalogue
      ansible.builtin.assert:
        that:
          - scenario is defined
          - scenario.id | default('') == scenario_id
        fail_msg: >-
          No scenario '{{ scenario_id }}' in ansible/scenarios.yml. Known ids:
          {{ _catalogue.scenarios | map(attribute='id') | join(', ') }}.
        success_msg: "Scenario '{{ scenario_id }}' has {{ scenario.expected_alerts | length }} expected alert(s)"
      run_once: true

    # Build a bool query per expected alert and poll the indexer until it holds min_count hits or the
    # latency budget is spent. The must array is assembled here rather than in scenarios.yml so the
    # catalogue stays a plain contract: rule.id, then one match_phrase per `match` field, then the
    # time window. no_log hides the basic-auth credentials on every retry.
    - name: Query the indexer for each expected alert within its latency budget
      ansible.builtin.uri:
        url: "{{ wazuh_indexer_base }}/wazuh-alerts-*/_search"
        method: POST
        url_username: "{{ wazuh_indexer_user }}"
        url_password: "{{ wazuh_indexer_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          size: 0
          query:
            bool:
              must: "{{ _alert_must | from_yaml }}"
        return_content: true
        status_code: 200
      vars:
        _alert_must: >-
          {%- set c = [{'match': {'rule.id': item.rule_id}}] -%}
          {%- for k, v in item.match.items() -%}
          {%- set _ = c.append({'match_phrase': {k: v}}) -%}
          {%- endfor -%}
          {%- set _ = c.append({'range': {'@timestamp': {'gte': scenario_window_start}}}) -%}
          {{ c }}
      register: _alert_hits
      no_log: true
      until: (_alert_hits.json.hits.total.value | default(0) | int) >= (item.min_count | int)
      retries: "{{ ((item.latency_budget_seconds | int) // (scenario_poll_delay | int)) + 1 }}"
      delay: "{{ scenario_poll_delay }}"
      failed_when: false
      loop: "{{ scenario.expected_alerts }}"
      loop_control:
        label: "rule {{ item.rule_id }}"

    # A dedicated assert, so the diagnostic names the rule, fields, window and the count actually
    # observed - the failure message an instructor reads when a scenario did not fire.
    - name: Assert every expected alert was observed within budget
      ansible.builtin.assert:
        that:
          - (item.json.hits.total.value | default(0) | int) >= (item.item.min_count | int)
        fail_msg: >-
          Scenario '{{ scenario_id }}': expected rule.id {{ item.item.rule_id }} matching
          {{ item.item.match }} at least {{ item.item.min_count }} time(s) since
          {{ scenario_window_start }}, but the indexer returned
          {{ item.json.hits.total.value | default(0) }} within
          {{ item.item.latency_budget_seconds }}s. Confirm the attack ran, the agent is connected,
          and that {{ item.item.rule_id }} is the rule that actually fires (confirm-on-host).
        success_msg: >-
          rule.id {{ item.item.rule_id }} observed
          {{ item.json.hits.total.value | default(0) }} time(s) (>= {{ item.item.min_count }})
      loop: "{{ _alert_hits.results }}"
      loop_control:
        label: "rule {{ item.item.rule_id }}"

# ---------------------------------------------------------------------------------------------
# SETUP - make the scenarios physically runnable (not part of the verify contract)
# ---------------------------------------------------------------------------------------------
# These plays are tagged `setup` so they never run under `--tags verify`. They prepare the ground a
# scenario needs before it can be trusted: the attacker's tools, and proof the manager is healthy.
#
# POWERING kali-01 ON is deliberately NOT done here. kali-01 is `started: false` in lab.yaml, and
# starting a VM is a `qm start 108` operation on the Proxmox host - Ansible runs from the jumpbox
# and has no route to the host's API. The operator (or the scenario:run Taskfile target, in a later
# wave) starts it on the host first; this play then reaches it across fw-01 over SSH and only
# installs tools. If kali-01 is off, this play fails fast at the connection, which is the honest
# signal to go start it.
- name: Ensure kali-01 carries the scenario attack tooling
  hosts: kali-01
  gather_facts: false
  become: true
  tags: [setup, tooling]

  tasks:

    # DNS FIRST, or nothing below can resolve a mirror. The isolated plane resolves via a public
    # resolver directly (lab.yaml sets the isolated dns to 1.1.1.1): fw-01's Unbound is a dead end
    # here - its DNSBL python module fails to init in the OPNsense chroot - and kali-01 already has
    # NAT egress, so 1.1.1.1 is reachable. kali-01 runs dhcpcd, which starts /etc/resolv.conf empty
    # of any nameserver. dhcpcd appends the contents of /etc/resolv.conf.tail to every resolv.conf it
    # writes, so that file is the durable fix; we also repair the live resolv.conf so this run can
    # resolve immediately without waiting for a lease renewal.
    - name: Pin a public nameserver for dhcpcd to append (durable)
      ansible.builtin.copy:
        dest: /etc/resolv.conf.tail
        content: "nameserver 1.1.1.1\n"
        owner: root
        group: root
        mode: "0644"

    # dhcpcd ships resolvconf; if it is present, `resolvconf -u` rebuilds /etc/resolv.conf from the
    # current leases plus the .tail we just wrote, which is the clean way to apply it now.
    - name: Check whether resolvconf is available
      ansible.builtin.command:
        cmd: command -v resolvconf
      register: kali_resolvconf
      changed_when: false
      failed_when: false

    - name: Rebuild resolv.conf via resolvconf when it is present
      ansible.builtin.command:
        cmd: resolvconf -u
      register: kali_resolvconf_update
      changed_when: false
      failed_when: false
      when: kali_resolvconf.rc == 0

    # Fallback for the case where resolvconf is absent (or a no-op): make sure the live resolv.conf
    # actually carries the nameserver right now, so the apt refresh below can resolve.
    - name: Ensure the live resolv.conf carries the public nameserver
      ansible.builtin.lineinfile:
        path: /etc/resolv.conf
        line: "nameserver 1.1.1.1"
        create: true
        owner: root
        group: root
        mode: "0644"

    # A Kali rolling host can fail a cache refresh for reasons unrelated to this lab (a mirror
    # mid-sync), so surface it without stopping the play - the same stance common_linux takes.
    - name: Refresh the apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      register: kali_apt_cache
      failed_when: false

    # hydra drives the ssh-bruteforce scenario, sqlmap the web-sqli scenario. Both are in Kali's
    # standard repositories; installing them by name keeps this reproducible rather than relying on
    # whatever the template happened to ship with.
    - name: Install the scenario attack tooling
      ansible.builtin.apt:
        name:
          - hydra
          - sqlmap
        state: present

    - name: Confirm each attack tool is on PATH
      ansible.builtin.shell:
        cmd: "command -v {{ item }}"
      register: kali_tool_check
      changed_when: false
      failed_when: false
      loop:
        - hydra
        - sqlmap
      loop_control:
        label: "{{ item }}"

    - name: Assert both attack tools are installed and resolvable
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout | length > 0
        fail_msg: >-
          {{ item.item }} is not on PATH on {{ inventory_hostname }} after install. The scenario
          that depends on it cannot run. Check the apt install output above.
        success_msg: "{{ item.item }} is present at {{ item.stdout }}"
      loop: "{{ kali_tool_check.results }}"
      loop_control:
        label: "{{ item.item }}"

# The rule-collision / manager-health gate. Before any scenario is declared runnable, prove the
# manager is actually up and analysisd is loaded - a scenario that fires perfectly is worthless if
# the daemon that would correlate it is down. This reuses the 70-detections auth pattern (POST
# authenticate?raw=true, then a read against the 55000 API on 127.0.0.1) and asserts on the daemon
# status. It touches no rules and reloads nothing, so it carries no collision risk of its own.
- name: Gate - confirm the Wazuh manager is healthy before scenarios run
  hosts: wazuh_manager
  gather_facts: false
  become: true
  tags: [setup, healthcheck]

  vars:
    wazuh_api_base: "https://127.0.0.1:{{ wazuh_api_port }}"

  tasks:

    - name: Obtain a Wazuh API token
      ansible.builtin.uri:
        url: "{{ wazuh_api_base }}/security/user/authenticate?raw=true"
        method: POST
        url_username: "{{ wazuh_api_user }}"
        url_password: "{{ wazuh_api_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: wazuh_auth
      no_log: true

    - name: Confirm a token was issued
      ansible.builtin.assert:
        that:
          - wazuh_auth.content | default('') | length > 0
        fail_msg: >-
          The Wazuh API did not return a token. Check MUTASPACE_WAZUH_API_USER and
          MUTASPACE_WAZUH_API_PASSWORD against .secrets/wazuh-passwords.txt.
        success_msg: "Authenticated to the Wazuh API"

    # /manager/status returns one object of daemon -> state. analysisd is the correlation engine
    # (no analysisd, no alerts) and remoted is the agent-ingest listener (no remoted, no events from
    # kali's target). Both must be running for a scenario to have any chance of proving itself.
    - name: Ask the manager for its daemon status
      ansible.builtin.uri:
        url: "{{ wazuh_api_base }}/manager/status"
        method: GET
        headers:
          Authorization: "Bearer {{ wazuh_auth.content }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: manager_status
      no_log: true

    - name: Assert analysisd and remoted are running
      ansible.builtin.assert:
        that:
          - _daemons['wazuh-analysisd'] | default('unknown') == 'running'
          - _daemons['wazuh-remoted'] | default('unknown') == 'running'
        fail_msg: >-
          The Wazuh manager is not healthy: wazuh-analysisd is
          '{{ _daemons['wazuh-analysisd'] | default('unknown') }}' and wazuh-remoted is
          '{{ _daemons['wazuh-remoted'] | default('unknown') }}'. Scenarios cannot be trusted until
          both are 'running'. Check `/var/ossec/logs/ossec.log` on wazuh-01.
        success_msg: "Manager healthy: analysisd and remoted are running"
      vars:
        _daemons: "{{ manager_status.json.data.affected_items[0] }}"

# ---------------------------------------------------------------------------------------------
# ATTACK PLAYS - one per scenario, tag-selected by the scenario id
# ---------------------------------------------------------------------------------------------
# Each attack play carries its own scenario-id tag (`ssh-bruteforce`, `web-sqli`), so
# `--tags <scenario_id>` runs exactly one attack and nothing else. They run FROM kali-01: Ansible
# connects to the attacker and drives the real tool (hydra / crafted curl) across fw-01 at the
# target, exactly as a student would. The Taskfile `scenario:run` target runs the attack tag first
# and then `--tags verify` as a second invocation, so the same contract in scenarios.yml proves the
# attack landed. Each play records a `scenario_run_started_at` fact for the operator's log; verify
# runs as its own process and anchors to its own last-15-minutes window (see the verify header),
# which is wider than the attack that just ran, so it cannot produce a false negative.
#
# kali-01 must be powered on (see the tooling play's note) and carry hydra/sqlmap - that is the
# `--tags tooling` / Wave-2 prerequisite, not repeated here.
- name: Run the ssh-bruteforce attack from kali-01
  hosts: kali-01
  gather_facts: false
  become: true
  tags: [ssh-bruteforce]

  vars:
    scenario_ssh_target: "10.10.10.30"
    # A NON-EXISTENT user, on purpose: every attempt is guaranteed to fail, which is what trips the
    # built-in non-existent-user rule (5710) and, once the burst crosses >= 8 failures / 120s, the
    # brute-force composite (5712). No real account is ever at risk.
    scenario_ssh_user: "baduser"
    scenario_ssh_wordlist: /tmp/mutaspace-scenario-ssh-passwords.txt
    # How many invalid-user connections the burst makes. Comfortably above the built-in >= 8
    # failures / 120s threshold so 5712 fires with margin, but small enough to finish in seconds.
    scenario_ssh_attempts: 15

  tasks:

    - name: Record the attack start time (UTC)
      ansible.builtin.set_fact:
        scenario_run_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Announce the attack window
      ansible.builtin.debug:
        msg: >-
          ssh-bruteforce: hydra + {{ scenario_ssh_attempts }} invalid-user attempts ->
          ssh://{{ scenario_ssh_target }} as '{{ scenario_ssh_user }}'
          starting at {{ scenario_run_started_at }}.

    # Ship the synthetic wordlist to kali rather than relying on a system list, so the attempt count
    # is fixed and the scenario is reproducible run to run.
    - name: Stage the synthetic password list on kali-01
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/scenario-ssh-passwords.txt"
        dest: "{{ scenario_ssh_wordlist }}"
        owner: root
        group: root
        mode: "0644"

    # hydra is the brute-force tool a student reaches for, so the scenario leads with it. Against
    # ubuntu-app-01, though, sshd enforces key-only auth (PasswordAuthentication no), so hydra probes
    # once, sees password auth is unsupported and stops - it still leaves a real "Invalid user"
    # attempt from the attacker in the log, but it cannot spray a wordlist at a target that refuses
    # passwords. Its rc is therefore not a pass/fail signal here (failed_when: false); the burst below
    # is what reliably generates the brute-force volume. This mirrors reality: a hardened target
    # defeats password spraying, and the detection that matters is the flood of invalid-user attempts.
    - name: Probe with hydra (best-effort against a key-only target)
      ansible.builtin.command:
        cmd: >-
          hydra -l {{ scenario_ssh_user }} -P {{ scenario_ssh_wordlist }}
          -t 4 ssh://{{ scenario_ssh_target }}
      register: scenario_ssh_hydra
      changed_when: true
      failed_when: false

    # The reliable trigger: a bounded burst of SSH connections as the non-existent user. Each one
    # makes sshd log "Invalid user baduser from 10.10.20.10" (rule 5710); enough of them inside 120s
    # trip the brute-force composite (5712). BatchMode + a throwaway known-hosts file keep every
    # attempt non-interactive and fast, and ssh's rc 255 (auth refused) is the expected outcome, so
    # the loop swallows it and just counts the attempts it made.
    - name: Drive the invalid-user SSH burst that crosses the brute-force threshold
      ansible.builtin.shell:
        cmd: |
          set -u
          n=0
          for _ in $(seq 1 {{ scenario_ssh_attempts }}); do
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
                {{ scenario_ssh_user }}@{{ scenario_ssh_target }} true >/dev/null 2>&1 || true
            n=$((n + 1))
          done
          echo "attempts=${n}"
      register: scenario_ssh_burst
      changed_when: true

    - name: Confirm the burst made the expected number of attempts
      ansible.builtin.assert:
        that:
          - "'attempts=' ~ scenario_ssh_attempts in scenario_ssh_burst.stdout"
        fail_msg: >-
          The invalid-user burst did not complete {{ scenario_ssh_attempts }} attempts against
          {{ scenario_ssh_target }} (saw: {{ scenario_ssh_burst.stdout | trim }}). Confirm kali-01
          can reach {{ scenario_ssh_target }}:22 across fw-01.
        success_msg: >-
          {{ scenario_ssh_attempts }} invalid-user attempts sent to {{ scenario_ssh_target }} as
          '{{ scenario_ssh_user }}' - the non-existent-user and brute-force rules should now fire.

- name: Run the web-sqli attack from kali-01
  hosts: kali-01
  gather_facts: false
  become: true
  tags: [web-sqli]

  vars:
    scenario_web_target: "http://10.10.10.30/"
    # SQL-injection request patterns, pre-URL-encoded so curl sends them verbatim and nginx logs the
    # payload into access.log (the Wave-2 localfile forwards that log to Wazuh, where the built-in web
    # ruleset flags the pattern). A spread of classic tokens - ' OR 1=1, UNION SELECT, DROP TABLE,
    # SLEEP - so at least one matches whichever web rule the manager's ruleset actually fires.
    scenario_web_payloads:
      - "id=1%27%20OR%20%271%27=%271"
      - "id=1%20UNION%20SELECT%20username,password%20FROM%20users--"
      - "id=1%27%3B%20DROP%20TABLE%20users%3B--"
      - "q=%27%20OR%201=1--"
      - "id=1%27%20AND%201=1%20UNION%20SELECT%20NULL,version()--"
      - "search=%27%20OR%20SLEEP(5)--"

  tasks:

    - name: Record the attack start time (UTC)
      ansible.builtin.set_fact:
        scenario_run_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Announce the attack window
      ansible.builtin.debug:
        msg: >-
          web-sqli: {{ scenario_web_payloads | length }} SQL-injection requests ->
          {{ scenario_web_target }} starting at {{ scenario_run_started_at }}.

    # Each request is a normal GET carrying an injection pattern in the query string. -o /dev/null
    # discards the body (the site is static; the response is irrelevant), --max-time bounds a hung
    # request, and -w prints the status so the operator sees the server answered. The point is the
    # LOG line each request leaves, not the response.
    - name: Send the SQL-injection request patterns with curl
      ansible.builtin.command:
        cmd: >-
          curl -s -o /dev/null -w '%{http_code}\n' --max-time 10
          "{{ scenario_web_target }}?{{ item }}"
      register: scenario_web_curl
      changed_when: true
      failed_when: scenario_web_curl.rc != 0
      loop: "{{ scenario_web_payloads }}"
      loop_control:
        label: "{{ item }}"

    - name: Report the response codes nginx returned
      ansible.builtin.debug:
        msg: "{{ scenario_web_curl.results | map(attribute='stdout') | map('trim') | list }}"

- name: Run the web-dir-bruteforce attack from kali-01
  hosts: kali-01
  gather_facts: false
  become: true
  tags: [web-dir-bruteforce]

  vars:
    scenario_web_target: "http://10.10.10.30"
    # A directory/content brute force: a burst of GETs for paths that do NOT exist on the static
    # nginx site. nginx answers 404 to each and logs it; the Wave-2 access.log localfile forwards
    # those lines to Wazuh, where the built-in web ruleset flags each 400 (31101) and, once enough
    # land from one source inside the window, the correlated web scan (31151). These are the entries
    # a real scanner's default wordlist hits first, so the pattern reads as a recognisable scan.
    scenario_dirbrute_paths:
      - admin
      - login
      - wp-admin
      - wp-login.php
      - phpmyadmin
      - .env
      - .git/config
      - config.php
      - backup.zip
      - shell.php
      - cmd.php
      - administrator
      - manager/html
      - api
      - private
      - secret
      - db.sql
      - old
      - backup
      - server-status
      - .htaccess
      - robots.txt.bak
      - uploads
      - console

  tasks:

    - name: Record the attack start time (UTC)
      ansible.builtin.set_fact:
        scenario_run_started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Announce the attack window
      ansible.builtin.debug:
        msg: >-
          web-dir-bruteforce: {{ scenario_dirbrute_paths | length }} requests for non-existent
          paths -> {{ scenario_web_target }} starting at {{ scenario_run_started_at }}.

    # Each request is a normal GET for a path that returns 404. -o /dev/null discards the body and
    # -w prints the status so the operator sees nginx answered 404; the point is the LOG line each
    # request leaves. The count comfortably crosses the built-in "multiple 400s" scan threshold.
    - name: Sweep the wordlist with curl
      ansible.builtin.command:
        cmd: >-
          curl -s -o /dev/null -w '%{http_code}\n' --max-time 10
          "{{ scenario_web_target }}/{{ item }}"
      register: scenario_dirbrute_curl
      changed_when: true
      failed_when: scenario_dirbrute_curl.rc != 0
      loop: "{{ scenario_dirbrute_paths }}"
      loop_control:
        label: "{{ item }}"

    - name: Report the response codes nginx returned
      ansible.builtin.debug:
        msg: >-
          {{ scenario_dirbrute_curl.results | map(attribute='stdout') | map('trim') | list }}

# ---------------------------------------------------------------------------------------------
# LIST - print the catalogue (read-only, no host, no credentials)
# ---------------------------------------------------------------------------------------------
# `scenario:list` is a convenience for the instructor: what scenarios exist, who attacks whom, and
# which rule proves each. It runs on localhost and loads scenarios.yml with the SAME include_vars
# the verify play uses, so the three verbs (list/run/verify) all read the one catalogue the one way
# - no yq or other YAML tool beyond the Ansible this repo already requires.
- name: List the scenario catalogue
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [list]

  tasks:

    - name: Load the scenario catalogue
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../scenarios.yml"
        name: _catalogue

    - name: Print each scenario as a one-line summary
      ansible.builtin.debug:
        msg: >-
          {{ '%-16s' | format(item.id) }} {{ '%-7s' | format(item.attack) }}
          {{ '%-26s' | format(item.origin ~ ' -> ' ~ item.target) }} rule(s)
          {{ item.expected_alerts | map(attribute='rule_id') | join(',') }}
          (<= {{ item.expected_alerts | map(attribute='latency_budget_seconds') | map('int') | max }}s)
      loop: "{{ _catalogue.scenarios }}"
      loop_control:
        label: "{{ item.id }}"
