# playbooks/70-detections.yml
#
# Detection as code: push files/wazuh-rules/local_rules.xml to the Wazuh manager through the API,
# then reload the ruleset.
#
# ---------------------------------------------------------------------------------------------
# WHY RELOAD AND NOT RESTART
# ---------------------------------------------------------------------------------------------
# `systemctl restart wazuh-manager` would also load the new rules. It would also drop every agent
# connection, re-queue the events those agents were mid-way through sending, and produce a gap in
# the data at the exact moment a class is looking at it. `PUT /manager/analysisd/reload` reloads the
# ruleset in place and leaves the agent connections alone.
#
# That difference is the whole reason this playbook uses the API instead of copying a file and
# bouncing a service. It is also the difference between a detection change being a routine
# operation and being something you only do out of hours.
# ---------------------------------------------------------------------------------------------
#
# WHY THE API CALLS RUN ON wazuh-01 ITSELF
# ---------------------------------------------------------------------------------------------
# The tasks below target the manager over SSH and then call the API on 127.0.0.1. The alternative -
# running the `uri` tasks from the control node against 10.10.10.20 - would require the control
# node to have a route to the SOC LAN and to trust the manager's self-signed certificate. Keeping
# the API conversation local to the manager makes this playbook work identically from a laptop, an
# analyst workstation, or a CI runner.
# ---------------------------------------------------------------------------------------------
#
# Usage:
#   export MUTASPACE_WAZUH_API_USER=wazuh
#   export MUTASPACE_WAZUH_API_PASSWORD='...'      # from .secrets/wazuh-passwords.txt
#   ansible-playbook playbooks/70-detections.yml
---
- name: Deploy custom detection rules to the Wazuh manager
  hosts: wazuh_manager
  gather_facts: false
  become: true

  vars:
    wazuh_api_base: "https://127.0.0.1:{{ wazuh_api_port }}"
    # The manager stores user rules under etc/rules, relative to /var/ossec.
    wazuh_rules_relative_dir: "etc/rules"
    wazuh_rules_staging_path: "/tmp/{{ wazuh_local_rules_file }}"

  tasks:

    # -----------------------------------------------------------------------------------------
    # Authenticate
    # -----------------------------------------------------------------------------------------
    # `?raw=true` makes the endpoint return the bare JWT as the response body instead of wrapping it
    # in a JSON envelope, which saves a parsing step. The token is short-lived by design - roughly
    # fifteen minutes - which is ample for this playbook and is why it is never cached anywhere.
    #
    # validate_certs is false because the installation assistant generates its own certificate
    # authority and this lab does not distribute that CA to the control node. That is a deliberate,
    # scoped exception: the connection is to 127.0.0.1 on the manager itself, so there is no network
    # path for anyone to interpose on.
    - name: Obtain a Wazuh API token
      ansible.builtin.uri:
        url: "{{ wazuh_api_base }}/security/user/authenticate?raw=true"
        method: POST
        url_username: "{{ wazuh_api_user }}"
        url_password: "{{ wazuh_api_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: 200
      register: wazuh_auth
      no_log: true

    - name: Confirm a token was issued
      ansible.builtin.assert:
        that:
          - wazuh_auth.content | default('') | length > 0
        fail_msg: >-
          The Wazuh API did not return a token. Check MUTASPACE_WAZUH_API_USER and
          MUTASPACE_WAZUH_API_PASSWORD against .secrets/wazuh-passwords.txt.
        success_msg: "Authenticated to the Wazuh API"

    # -----------------------------------------------------------------------------------------
    # Push the rules
    # -----------------------------------------------------------------------------------------
    # The file is copied to the manager first and then uploaded from there, rather than being
    # streamed from the control node, so that the byte content that reaches the API is unambiguous.
    - name: Stage the rules file on the manager
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/wazuh-rules/{{ wazuh_local_rules_file }}"
        dest: "{{ wazuh_rules_staging_path }}"
        mode: "0640"

    # The API validates the ruleset before accepting it. A rule with a malformed regex or a
    # duplicate ID is rejected here with a specific error, which is far better than discovering it
    # after analysisd has already restarted with a broken configuration.
    - name: Upload local_rules.xml through the API
      ansible.builtin.uri:
        url: >-
          {{ wazuh_api_base }}/rules/files/{{ wazuh_local_rules_file }}?overwrite=true&relative_dirname={{ wazuh_rules_relative_dir }}
        method: PUT
        src: "{{ wazuh_rules_staging_path }}"
        remote_src: true
        headers:
          Authorization: "Bearer {{ wazuh_auth.content }}"
          Content-Type: application/octet-stream
        validate_certs: false
        return_content: true
        status_code: 200
      register: rules_upload
      no_log: true

    - name: Show the upload result
      ansible.builtin.debug:
        msg: "{{ rules_upload.json.message | default('Rules file uploaded') }}"

    # -----------------------------------------------------------------------------------------
    # Push the Suricata EVE-over-syslog decoder
    # -----------------------------------------------------------------------------------------
    # Same staged-then-uploaded pattern as the rules, but against the /decoders endpoint. This
    # decoder is what makes the fw-01 Suricata syslog stream decode at all - without it the
    # 86xxx Suricata rules never fire (Wazuh ships the rules but not a syslog-path decoder). See
    # the header of files/wazuh-decoders/suricata-eve.xml for the full reasoning.
    - name: Stage the Suricata decoder on the manager
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/wazuh-decoders/{{ wazuh_local_decoders_file }}"
        dest: "/tmp/{{ wazuh_local_decoders_file }}"
        mode: "0640"

    - name: Upload the Suricata decoder through the API
      ansible.builtin.uri:
        url: >-
          {{ wazuh_api_base }}/decoders/files/{{ wazuh_local_decoders_file }}?overwrite=true&relative_dirname=etc/decoders
        method: PUT
        src: "/tmp/{{ wazuh_local_decoders_file }}"
        remote_src: true
        headers:
          Authorization: "Bearer {{ wazuh_auth.content }}"
          Content-Type: application/octet-stream
        validate_certs: false
        return_content: true
        status_code: 200
      register: decoder_upload
      no_log: true

    - name: Show the decoder upload result
      ansible.builtin.debug:
        msg: "{{ decoder_upload.json.message | default('Decoder file uploaded') }}"

    # -----------------------------------------------------------------------------------------
    # Reload
    # -----------------------------------------------------------------------------------------
    - name: Reload analysisd so the new rules take effect
      ansible.builtin.uri:
        url: "{{ wazuh_api_base }}/manager/analysisd/reload"
        method: PUT
        headers:
          Authorization: "Bearer {{ wazuh_auth.content }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: analysisd_reload
      no_log: true
      changed_when: true

    - name: Show the reload result
      ansible.builtin.debug:
        msg: "{{ analysisd_reload.json.message | default('analysisd reloaded') }}"

    # -----------------------------------------------------------------------------------------
    # Validation
    # -----------------------------------------------------------------------------------------
    # Uploading a file and reloading a daemon are two things that can both succeed while the rule
    # you care about is still not loaded - for example if it was silently skipped for referencing a
    # parent rule that does not exist. Asking the manager to describe the rule by ID is the check
    # that closes that gap.
    - name: Ask the manager to confirm each custom rule is loaded
      ansible.builtin.uri:
        url: "{{ wazuh_api_base }}/rules?rule_ids={{ item }}"
        method: GET
        headers:
          Authorization: "Bearer {{ wazuh_auth.content }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: rule_checks
      loop:
        - 100010
        - 100011
        - 100020
        - 100021
      loop_control:
        label: "rule {{ item }}"
      changed_when: false

    - name: Assert that every custom rule is present in the loaded ruleset
      ansible.builtin.assert:
        that:
          - item.json.data.total_affected_items | int == 1
        fail_msg: >-
          Rule {{ item.item }} is not loaded. Check
          `/var/ossec/logs/ossec.log` on wazuh-01 for a ruleset parsing error.
        success_msg: "Rule {{ item.item }} is loaded"
      loop: "{{ rule_checks.results }}"
      loop_control:
        label: "rule {{ item.item }}"

    - name: Remove the staged copies
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ wazuh_rules_staging_path }}"
        - "/tmp/{{ wazuh_local_decoders_file }}"

# ---------------------------------------------------------------------------------------------
# SURICATA INGESTION - the Wazuh half of EVE -> Wazuh (fw half is 05-fw-config.yml)
# ---------------------------------------------------------------------------------------------
# fw-01's Suricata emits EVE JSON to a remote syslog destination (05-fw-config.yml, part c) aimed at
# 10.10.10.20:514/udp. For the manager to ACCEPT that stream it needs a syslog <remote> listener in
# ossec.conf, scoped to fw-01's address.
#
# It ALSO needs the Suricata decoder deployed by the main play above (files/wazuh-decoders/
# suricata-eve.xml). This was proven the hard way on 2026-07-24: Wazuh ships the Suricata *rules*
# (86xxx) but NOT a decoder for the SYSLOG path - the built-in json decoder only matches logs that
# begin with '{', which the syslog frame `suricata[pid]: {json}` defeats, so `wazuh-logtest`
# reported "No decoder matched" and no alert was ever produced. The listener alone is NOT enough.
#
# WHY THIS DEVIATES FROM THE reload-only RULE AT THE TOP OF THIS FILE
# ---------------------------------------------------------------------------------------------
# The detection-rules play above reloads analysisd on purpose, to avoid dropping agents. This play
# CANNOT: a NEW <remote> listener opens a new UDP SOCKET, and only a full `systemctl restart
# wazuh-manager` binds it - an analysisd reload does not touch remoted's sockets. A manager restart
# briefly DROPS every agent (they buffer and reconnect), so this is an OUT-OF-CLASS step, run
# deliberately in a maintenance moment, not mid-lesson. It is a separate play, and tagged
# `suricata-ingest`, so the routine detection-rules run never triggers the restart.
#
# VERIFY (live, after the W2 cutover + 05-fw-config suricata run): from a lab VM, across fw-01,
#   curl http://testmynids.org/uid/index.html
# should produce a Suricata alert (an 86xxx-range rule) in the Wazuh indexer/dashboard.
#
# Usage:
#   ansible-playbook playbooks/70-detections.yml --tags suricata-ingest
- name: Add the fw-01 Suricata syslog listener to the Wazuh manager
  hosts: wazuh_manager
  gather_facts: false
  become: true
  tags: [suricata-ingest]

  vars:
    wazuh_ossec_conf: /var/ossec/etc/ossec.conf

  tasks:

    # blockinfile is idempotent by its marker: the block is added once and left alone on re-runs.
    # insertbefore inserts before the LAST </ossec_config>, so the <remote> block lands inside the
    # configuration root. allowed-ips scopes the listener to fw-01 (10.10.10.1) so nothing else on
    # the SOC LAN can inject syslog events as if they were the firewall.
    - name: Ensure the Suricata syslog <remote> listener is in ossec.conf
      ansible.builtin.blockinfile:
        path: "{{ wazuh_ossec_conf }}"
        marker: "<!-- {mark} MUTASPACE Suricata syslog listener (managed by 70-detections.yml) -->"
        insertbefore: "</ossec_config>"
        block: |
          <remote>
            <connection>syslog</connection>
            <port>514</port>
            <protocol>udp</protocol>
            <allowed-ips>10.10.10.1</allowed-ips>
          </remote>
      register: wazuh_suricata_listener

    # DELIBERATE full restart (see the play header): only a restart binds the new UDP listener
    # socket, and it briefly drops agents. Gated on `changed` so a re-run that added nothing does
    # NOT bounce the manager needlessly.
    - name: Restart wazuh-manager to bind the new syslog listener (drops agents briefly)
      ansible.builtin.systemd:
        name: wazuh-manager
        state: restarted
      when: wazuh_suricata_listener.changed

    - name: Report the listener/restart outcome
      ansible.builtin.debug:
        msg: >-
          {{ 'Added the fw-01 Suricata syslog listener and restarted wazuh-manager (agents will
          reconnect).' if wazuh_suricata_listener.changed
          else 'Suricata syslog listener already present; no restart needed.' }}
