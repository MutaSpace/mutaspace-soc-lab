# inventory/hosts.yml
#
# The static, committed inventory for the MutaSpace SOC Lab.
#
# WHY STATIC: every address in this lab is decided in advance. Servers get static IPs from
# cloud-init; workstations get DHCP reservations pinned to a MAC address that is itself derived
# from the IP. Nothing here has to be discovered at run time, so a dynamic inventory plugin would
# add a moving part and a Proxmox API dependency in exchange for information the design already
# fixed. A committed inventory is also readable: a learner can open this one file and see the whole
# lab, which a plugin cannot offer.
#
# ---------------------------------------------------------------------------------------------
# THE TWO WINDOWS GROUPS - the single most important thing in this file
# ---------------------------------------------------------------------------------------------
# A Windows machine changes identity when it is promoted to a domain controller or joined to the
# domain. Before that moment it authenticates as its own local Administrator over NTLM. After it,
# the local account is gone (on a DC it becomes the domain Administrator) and the correct way in is
# Kerberos against the domain.
#
# Ansible cannot express "these credentials, but only until task 14". So the same physical machine
# is listed TWICE, under two inventory names, in two groups with two sets of connection variables:
#
#   bootstrap_windows  -> `<name>-bootstrap`  local Administrator, NTLM, WinRM 5985
#   domain_windows     -> `<name>`            MUTASPACE\Administrator, Kerberos, WinRM 5985
#
# Playbooks that run BEFORE promotion/join target the -bootstrap name. Playbooks that run AFTER
# target the plain name. Both reach the same machine - the bootstrap entry addresses it by IP
# because no DNS exists yet, and the domain entry addresses it by FQDN because Kerberos requires a
# name.
#
# This is not duplication for its own sake - it is the inventory admitting that the reboot in
# 10-dc-promote.yml and 30-domain-join.yml is an identity change, not just a restart.
# ---------------------------------------------------------------------------------------------
---
all:
  children:

    # -----------------------------------------------------------------------------------------
    # Firewall - OPNsense 26.7, VMID 100
    # -----------------------------------------------------------------------------------------
    # fw-01 is in the inventory so 00-preflight.yml can prove the gateway is up before anything
    # else runs. Its own configuration is not managed by these playbooks yet: OPNsense is
    # configured through its API/config.xml, which is a separate piece of work. Listing it here
    # and being honest about that is better than pretending it is absent.
    firewall:
      hosts:
        fw-01:
          ansible_host: 10.10.10.1
          ansible_connection: ansible.builtin.ssh
          ansible_user: root
          lab_note: "OPNsense 26.7. Reachability-checked only; not configured by these playbooks."

    # -----------------------------------------------------------------------------------------
    # Linux hosts - Ubuntu Server/Desktop 24.04 and Kali Rolling
    # -----------------------------------------------------------------------------------------
    linux:
      hosts:
        wazuh-01:
          ansible_host: 10.10.10.20
          lab_vmid: 104
          lab_role: "Wazuh 4.14.6 all-in-one: manager, indexer, dashboard"
        ubuntu-app-01:
          ansible_host: 10.10.10.30
          lab_vmid: 106
          lab_role: "Linux application server - OpenSSH and Nginx"
        analyst-01:
          # DHCP reservation, not a static address. The reservation is templated from the same
          # IP-to-MAC map OPNsense and OpenTofu use, which is why .50 is stable across rebuilds.
          ansible_host: 10.10.10.50
          lab_vmid: 103
          lab_role: "Ubuntu Desktop analyst workstation"
        kali-01:
          ansible_host: 10.10.20.10
          lab_vmid: 108
          lab_role: "Attacker workstation on the isolated segment"
        untrusted-01:
          ansible_host: 10.10.20.20
          lab_vmid: 109
          lab_role: "Untrusted host on the isolated segment"
        nlp-01:
          ansible_host: 10.10.20.30
          lab_vmid: 110
          lab_role: "Analysis/NLP workload on the isolated segment"

    # -----------------------------------------------------------------------------------------
    # Windows BEFORE the domain exists - local Administrator over NTLM
    # -----------------------------------------------------------------------------------------
    bootstrap_windows:
      hosts:
        dc-01-bootstrap:
          ansible_host: 10.10.10.10
          lab_vmid: 102
          lab_target_hostname: dc-01
          lab_role: "Windows Server 2022 - future domain controller and DNS server"
        win-client-01-bootstrap:
          ansible_host: 10.10.10.51
          lab_vmid: 105
          lab_target_hostname: win-client-01
          lab_role: "Windows 11 domain workstation"

    # -----------------------------------------------------------------------------------------
    # Windows AFTER the domain exists - MUTASPACE\Administrator over Kerberos
    # -----------------------------------------------------------------------------------------
    # These hosts are addressed by FQDN, not by IP. Kerberos matches the ticket against the service
    # principal name of the host you asked for, and an IP address is not a name - authentication
    # fails before WinRM is ever reached. This is the practical reason 20-dns-records.yml must run
    # before any play that targets this group.
    domain_windows:
      hosts:
        dc-01:
          ansible_host: dc-01.mutaspace.local
          lab_vmid: 102
          lab_ip: 10.10.10.10
          lab_role: "Active Directory domain controller and DNS server"
        win-client-01:
          ansible_host: win-client-01.mutaspace.local
          lab_vmid: 105
          lab_ip: 10.10.10.51
          lab_role: "Windows 11 domain workstation"

  # ---------------------------------------------------------------------------------------------
  # Function groups
  # ---------------------------------------------------------------------------------------------
  # These overlay the connection groups above. They carry only role variables - never connection
  # variables - so there is exactly one place that decides how Ansible talks to a host.
  # ---------------------------------------------------------------------------------------------

wazuh_manager:
  hosts:
    wazuh-01:

# Every Linux host that should carry a Wazuh agent. wazuh-01 is deliberately absent: the all-in-one
# installer puts a local agent on the manager itself, and enrolling a second one produces a
# duplicate-agent-name failure.
wazuh_agents_linux:
  hosts:
    ubuntu-app-01:
      wazuh_agent_group: linux-servers
    analyst-01:
      wazuh_agent_group: linux-workstations
    kali-01:
      wazuh_agent_group: isolated
    untrusted-01:
      wazuh_agent_group: isolated
    nlp-01:
      wazuh_agent_group: isolated

# Windows agents enroll only after the domain join, so these are the post-join inventory names.
wazuh_agents_windows:
  hosts:
    dc-01:
      wazuh_agent_group: windows-servers
    win-client-01:
      wazuh_agent_group: windows-workstations

# Network segment membership, used by 00-preflight.yml to check the right gateway for each host
# and by documentation that wants to answer "what is actually on vmbr2".
soc_lan:
  hosts:
    dc-01:
    dc-01-bootstrap:
    win-client-01:
    win-client-01-bootstrap:
    wazuh-01:
    ubuntu-app-01:
    analyst-01:
  vars:
    lab_segment: "vmbr1 - SOC LAN 10.10.10.0/24"
    lab_segment_gateway: 10.10.10.1

isolated_lan:
  hosts:
    kali-01:
    untrusted-01:
    nlp-01:
  vars:
    lab_segment: "vmbr2 - isolated 10.10.20.0/24"
    lab_segment_gateway: 10.10.20.1
