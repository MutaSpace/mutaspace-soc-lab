# roles/wazuh_agent_windows/tasks/main.yml
#
# Install and enroll the Wazuh agent on a Windows host via the MSI.
#
# This runs against the domain identity, after 30-domain-join.yml, because the agent name has to
# match the machine's post-join hostname. Installing the agent before the rename produces an agent
# called something like WIN-ABC123 that has to be deleted and re-enrolled by hand.
---
- name: Download the pinned Wazuh agent MSI
  ansible.windows.win_get_url:
    url: "{{ wazuh_agent_msi_url }}"
    dest: "{{ wazuh_agent_msi_path }}"

# ---------------------------------------------------------------------------------------------
# Install and enroll in one step
# ---------------------------------------------------------------------------------------------
# The MSI properties are the exact counterparts of the Linux package's environment variables, and
# they carry the same restriction: they are consumed at install time only. Changing a group later
# is done on the manager, not by re-running the installer.
#
# `arguments` is given as a list so that Ansible handles the quoting. Passing one long string here
# is the usual way this task breaks - a hostname is fine, but a group name with a hyphen in it
# starts behaving unpredictably.
- name: Install the Wazuh agent and enroll it
  ansible.windows.win_package:
    path: "{{ wazuh_agent_msi_path }}"
    state: present
    arguments:
      - /q
      - "WAZUH_MANAGER={{ wazuh_agent_enroll_address }}"
      - "WAZUH_AGENT_NAME={{ wazuh_agent_name }}"
      - "WAZUH_AGENT_GROUP={{ wazuh_agent_group }}"
  notify: Restart the Wazuh agent service

# ---------------------------------------------------------------------------------------------
# Switch the running configuration from the enrollment IP to the FQDN
# ---------------------------------------------------------------------------------------------
# Same reasoning as the Linux role: enroll by address because DNS may not have been ready, then
# move to the name so the manager can be re-addressed later without touching every endpoint.
#
# win_powershell defaults $Ansible.Changed to $true, so the guard is explicit. The regex replaces
# only the text between the <address> tags, and comparing the result to the original is what makes
# the task honest about whether it changed anything.
- name: Point the agent at the manager's FQDN
  ansible.windows.win_powershell:
    parameters:
      ConfigPath: "{{ wazuh_agent_config_path }}"
      Address: "{{ wazuh_agent_final_address }}"
    script: |
      param(
          [String]$ConfigPath,
          [String]$Address
      )

      $Ansible.Changed = $false

      $original = Get-Content -LiteralPath $ConfigPath -Raw -ErrorAction Stop
      $updated  = $original -replace '(?<=<address>)[^<]*(?=</address>)', $Address

      if ($updated -ne $original) {
          Set-Content -LiteralPath $ConfigPath -Value $updated -NoNewline -Encoding UTF8
          $Ansible.Changed = $true
          $Ansible.Result = "Manager address set to $Address"
      }
      else {
          $Ansible.Result = "Manager address already $Address"
      }
  when: wazuh_agent_use_fqdn | bool
  notify: Restart the Wazuh agent service

- name: Ensure the Wazuh agent service is running and set to start automatically
  ansible.windows.win_service:
    name: "{{ wazuh_agent_service_name }}"
    state: started
    start_mode: auto

# ---------------------------------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------------------------------
- name: Confirm the agent holds an enrollment key
  ansible.windows.win_stat:
    path: 'C:\Program Files (x86)\ossec-agent\client.keys'
  register: wazuh_client_keys_win

- name: Assert that enrollment produced a key
  ansible.builtin.assert:
    that:
      - wazuh_client_keys_win.stat.exists
      - wazuh_client_keys_win.stat.size > 0
    fail_msg: >-
      client.keys is missing or empty on {{ inventory_hostname }}. The service is installed but the
      agent never registered. Check that {{ wazuh_agent_enroll_address }} is reachable on TCP 1515
      and that the agent name {{ wazuh_agent_name }} is not already registered on the manager.
    success_msg: "{{ inventory_hostname }} is enrolled as {{ wazuh_agent_name }}"
